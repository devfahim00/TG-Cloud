name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.devfahim --project-name tg_cloud .
      - name: Patch manifest (permissions + app name)
        run: python3 tool/patch_manifest.py
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: tg-cloud-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Debug build (latest)
          prerelease: true
          files: build/app/outputs/flutter-apk/app-debug.apk
